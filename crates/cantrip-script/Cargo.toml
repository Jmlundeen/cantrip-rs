[package]
name = "cantrip-script"
description = "The .cantrip scenario runner, with the C# runner's semantics, against the native engine."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
staged = ["cantrip-engine/staged"]

[dependencies]
cantrip-engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
cantrip-cards.workspace = true
cantrip-mechanics.workspace = true
cantrip-api.workspace = true
cantrip-state.workspace = true
cantrip-oracle.workspace = true
