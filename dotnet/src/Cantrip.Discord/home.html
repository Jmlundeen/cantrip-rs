<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantrip - My Games</title>
<link rel="icon" href="data:,">
<style>
:root {
  --window: #111318;
  --bar: #191c22;
  --panel: #1d2127;
  --line: #2c313a;
  --control: #2a303a;
  --control-hover: #353c48;
  --control-border: #3a4250;
  --fg: #e8eaee;
  --fg-soft: #a6adb8;
  --fg-muted: #6c7482;
  --on-accent: #17130a;
  --accent: #f1b44c;
  --accent-hover: #f6c66e;
  --ready: #6fcf8f;
  --danger: #e5534b;
  --hover: #8ec9ff;
  --discord: #5865f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--window);
  color: var(--fg);
  font: 14px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Roboto, "Helvetica Neue", sans-serif;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
a { color: var(--hover); }

header.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 24px; background: var(--bar); border-bottom: 1px solid var(--line);
}
header.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2px; }
header.top h1 span { color: var(--accent); }
header.top nav a { color: var(--fg-soft); text-decoration: none; font-size: 13px; }
header.top nav a:hover { color: var(--fg); }
header.top .who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-soft); }
header.top .who strong { color: var(--fg); font-weight: 600; }

main { max-width: 960px; margin: 0 auto; padding: 20px 24px 60px; }

.notice {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--danger); border-radius: 6px; padding: 10px 14px; margin-bottom: 20px;
}
.notice .grow { flex: 1; min-width: 200px; }

section { margin-bottom: 32px; }
section > h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
section > .about { color: var(--fg-soft); font-size: 13px; margin: 0 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card.mine { border-color: var(--accent); }
.card .head { display: flex; align-items: baseline; gap: 8px; }
.card .name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { color: var(--fg-soft); font-size: 13px; }
.card .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card .foot .what { color: var(--accent); font-weight: 600; flex: 1; }
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .4px;
  text-transform: uppercase; background: rgba(166,173,184,.14); color: var(--fg-soft); white-space: nowrap;
}
.badge.live { background: rgba(111,207,143,.14); color: var(--ready); }
.empty { color: var(--fg-muted); padding: 4px 0 8px; }

button.plain, button.primary, button.discord, a.button {
  border-radius: 4px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--control-border);
  background: var(--control); text-decoration: none; display: inline-block; font-size: 14px; color: var(--fg);
}
button.plain:hover, a.button:hover { background: var(--control-hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.primary:hover { background: var(--accent-hover); }
button.discord { background: var(--discord); border-color: var(--discord); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a.button:focus-visible { outline: 2px solid var(--hover); outline-offset: 1px; }

.signin { text-align: center; padding: 56px 0; }
.signin p { color: var(--fg-soft); margin: 0 0 16px; }

@media (max-width: 600px) {
  header.top { padding: 10px 16px; }
  main { padding: 16px 16px 48px; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <h1><span>Cantrip</span> My Games</h1>
  <nav><a href="./">Home</a> &middot; <a href="draft">Draft</a> &middot; <a href="constructed">Constructed</a> &middot; <a href="decks">Deck Editor</a> &middot; <a href="status">Server status</a></nav>
  <div class="who" id="who"></div>
</header>
<main>
  <div id="notices"></div>
  <div id="content"></div>
</main>

<script>
(() => {
  "use strict";

  // The page asks the server what the player is in, every few seconds. Getting back to a seat is the draft and constructed
  // pages' own API, which answers with a link to the web client, the seat's ticket after its #, which nothing here keeps.
  let board = null;
  let failure = null;
  let busy = false;

  const $ = id => document.getElementById(id);
  const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const FORMATS = { booster: "Booster draft", grid: "Grid draft", winston: "Winston draft", standard: "Standard Gauntlet" };
  const named = key => FORMATS[key] ?? key ?? "Draft";

  function renderWho() {
    const who = $("who");
    if (!board) { who.innerHTML = ""; return; }
    if (board.me) who.innerHTML = `Signed in as <strong>${esc(board.me.name)}</strong> <button class="plain" id="signout">Sign out</button>`;
    else if (board.signIn) who.innerHTML = `<button class="discord" id="signin">Log in with Discord</button>`;
  }

  function draftCard(d) {
    const what = d.drafting ? "Your draft is under way" : "Your table is still filling";
    const meta = [named(d.format), d.cube].filter(Boolean).join(" · ");
    const players = d.players && d.seats ? `${d.players.length} of ${d.seats} seated: ${d.players.map(esc).join(", ")}` : "";
    const action = d.drafting
      ? `<button class="primary" data-return>Back to my draft</button>`
      : `<button class="primary" data-table="${esc(d.table)}">Open my table</button>`;
    return `<div class="card mine">
      <div class="head"><span class="name">${esc(meta || "Draft")}</span><span class="badge${d.drafting ? " live" : ""}">${d.drafting ? "In progress" : "Forming"}</span></div>
      ${players ? `<div class="meta">${players}</div>` : ""}
      <div class="foot"><span class="what">${what}</span>${action}</div>
    </div>`;
  }

  function gameCard(g) {
    const what = g.stage === "Open" ? "Waiting for an opponent" : g.stage === "Seated" ? "Waiting for both players to sit down" : "Playing";
    return `<div class="card mine">
      <div class="head"><span class="name">${esc(g.players.join(" vs "))}</span><span class="badge${g.stage === "Playing" ? " live" : ""}">${esc(g.stage === "Open" ? "Waiting" : g.stage)}</span></div>
      <div class="meta">${esc(named(g.format))}</div>
      <div class="foot"><span class="what">${what}</span><button class="primary" data-game="${esc(g.id)}">Open my game</button></div>
    </div>`;
  }

  function renderContent() {
    if (!board) { $("content").innerHTML = ""; return; }
    if (!board.me) {
      $("content").innerHTML = board.signIn
        ? `<div class="signin"><p>Log in with Discord to see the games you are in and get back to them.</p><button class="discord" id="signin-big">Log in with Discord</button></div>`
        : `<div class="signin"><p>Sign-in isn't set up on this server, so there are no accounts to show games for.</p><a class="button" href="./">Home</a></div>`;
      return;
    }

    const games = [];
    if (board.draft) games.push(draftCard(board.draft));
    if (board.constructed) games.push(gameCard(board.constructed));
    const places = [];
    if (board.hasDrafts) places.push(`<a class="button" href="draft">Draft</a>`);
    if (board.hasConstructed) places.push(`<a class="button" href="constructed">Constructed</a>`);
    if (board.hasDecks) places.push(`<a class="button" href="decks">Deck Editor</a>`);

    $("content").innerHTML = `
      <section aria-labelledby="h-games">
        <h2 id="h-games">Current games</h2>
        <p class="about">Get back to a seat you have: a table that is filling, a draft or a game under way.</p>
        ${games.length ? `<div class="cards">${games.join("")}</div>` : `<div class="empty">You are not in a game. Start one from Draft or Constructed.</div>`}
      </section>
      <section aria-labelledby="h-leagues">
        <h2 id="h-leagues">Leagues</h2>
        <p class="about">Standings and the matches you owe will be here once leagues are running.</p>
        ${board.leagues.length ? "" : `<div class="empty">No leagues yet.</div>`}
      </section>
      ${places.length ? `<section aria-labelledby="h-play"><h2 id="h-play">Find a game</h2><p class="about">Sit down at a table.</p><div class="cards" style="display:flex;gap:10px;flex-wrap:wrap">${places.join("")}</div></section>` : ""}`;
  }

  function renderNotices() {
    $("notices").innerHTML = failure
      ? `<div class="notice"><span class="grow">${esc(failure)}</span><button class="plain" data-dismiss>Dismiss</button></div>`
      : "";
  }

  function render() {
    renderWho();
    renderNotices();
    renderContent();
  }

  async function refresh() {
    try {
      const response = await fetch("home/api/board", { cache: "no-store", credentials: "same-origin" });
      if (!response.ok) throw new Error(`${response.status}`);
      board = (await response.json()).value;
    } catch {
      return;
    }
    if (!busy) render();
  }

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST", credentials: "same-origin", cache: "no-store",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}),
    });
    if (response.status === 401) { location.assign("signin?then=home"); return null; }
    if (!response.ok) throw new Error(`The server said ${response.status}.`);
    return (await response.json()).value;
  }

  // Goes to the seat in this tab, or says why not.
  async function seat(path, body) {
    if (busy) return;
    busy = true;
    try {
      const answer = await post(path, body);
      if (answer?.link) { location.assign(answer.link); return; }
      failure = answer?.refusal ?? "No seat could be had.";
    } catch (error) {
      failure = error.message || "The server could not be reached.";
    } finally {
      busy = false;
    }
    await refresh();
    render();
  }

  document.addEventListener("click", async event => {
    const target = event.target.closest("button");
    if (!target || target.disabled) return;
    if (target.id === "signin" || target.id === "signin-big") location.assign("signin?then=home");
    else if (target.id === "signout") {
      try { await post("signout"); } catch { /* signed out or not, the board says */ }
      await refresh();
    }
    else if (target.dataset.table) await seat("draft/api/join", { table: target.dataset.table });
    else if ("return" in target.dataset) await seat("draft/api/return");
    else if (target.dataset.game) await seat("constructed/api/join", { game: target.dataset.game });
    else if ("dismiss" in target.dataset) { failure = null; render(); }
  });

  if (new URLSearchParams(location.search).get("signin") === "failed") {
    failure = "Signing in with Discord didn't go through. Try again.";
    history.replaceState(null, "", location.pathname);
  }

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
