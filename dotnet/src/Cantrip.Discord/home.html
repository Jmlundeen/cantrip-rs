<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantrip - Home</title>
<!--site:head-->
<style>
.outcome { min-width: 110px; text-align: right; }
@media (max-width: 760px) { .outcome { text-align: left; min-width: 0; } }
</style>
</head>
<body data-page="home">
<!--site:header-->
<main id="main">
  <div id="content" aria-live="polite"><p class="hint">Loading&hellip;</p></div>
</main>
<!--site:footer-->

<script>
(() => {
  "use strict";

  // The player's own page: what they are playing now - a table filling, a draft or a pod, a constructed game - to get
  // back to or leave; their events being played and over; and where to go next. Everything is asked of the server
  // every few seconds; getting back to a seat is the draft and constructed pages' own API, which answers with a link to
  // the web client, the seat's ticket after its #, which nothing here keeps.
  let board = null;
  let busy = false;

  const $ = id => document.getElementById(id);
  const { esc, plural, who } = window.Cantrip ?? {};
  const named = key => window.Cantrip.formatName(key);
  const when = iso => {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "";
    const days = Math.floor((Date.now() - date.getTime()) / 86_400_000);
    if (days < 1) return `Today, ${date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
    if (days < 2) return "Yesterday";
    if (days < 7) return `${days} days ago`;
    return date.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
  };
  const results = id => `status#event=${encodeURIComponent(id)}`;
  const leaguePage = id => `leagues/${encodeURIComponent(id)}`;
  const record = r => `${r.wins}-${r.losses}${r.draws ? `-${r.draws}` : ""}`;

  // A league the player has entered: how their run stands - or how the last went - and the way to it.
  function leagueCard(l) {
    const mine = l.mine;
    const run = mine.current;
    let badge;
    let what;
    let action = `<a class="button small${run ? "" : " primary"}" href="${leaguePage(l.id)}">Open league</a>`;
    if (run?.stage === "Drafting") {
      badge = `<span class="badge Drafting">Drafting</span>`;
      what = "Your draft is under way";
      action = `<a class="button quiet small" href="${leaguePage(l.id)}">Open league</a><button type="button" class="button primary small" data-league-play="${esc(l.id)}">Back to my draft</button>`;
    } else if (mine.opponent) {
      badge = `<span class="badge live">Match</span>`;
      what = `Playing ${mine.opponent.name}`;
      action = `<a class="button quiet small" href="${leaguePage(l.id)}">Open league</a><button type="button" class="button primary small" data-league-play="${esc(l.id)}">Go to my match</button>`;
    } else if (run) {
      badge = `<span class="badge live">${esc(record(run))}</span>`;
      what = mine.searchingSince ? "Looking for a match" : "Between matches";
      action = `<a class="button primary small" href="${leaguePage(l.id)}">${mine.searchingSince ? "Open league" : "Find a match"}</a>`;
    } else {
      const last = mine.previous[0];
      badge = last ? `<span class="badge${last.ending === "trophy" ? " won" : ""}">${esc(last.ending === "trophy" ? "Trophy" : record(last))}</span>` : "";
      what = last ? `Last run ${record(last)} · ${last.status.toLowerCase()}` : "No run going";
    }
    const trophies = mine.trophies ? ` · ${plural(mine.trophies, "trophy", "trophies")}` : "";
    return `<div class="card${run ? " mine" : ""}">
      <div class="head"><span class="name">${esc(l.name)}</span>${badge}</div>
      <div class="meta">${esc([l.cube, named(l.rules.format)].filter(Boolean).join(" · "))}${esc(trophies)}</div>
      <div class="foot"><span class="what${run ? "" : " plain"}">${esc(what)}</span>${action}</div>
    </div>`;
  }

  function tableCard(d) {
    const seated = d.players && d.seats ? `${d.players.length} of ${d.seats} seated` : "";
    const chips = (d.players ?? []).map(p => `<span class="chip${p.name === board.me.name ? " me" : ""}">${who(p, true)}</span>`).join("")
      + Array.from({ length: Math.max(0, (d.seats ?? 0) - (d.players?.length ?? 0)) }, () => `<span class="chip open">Open seat</span>`).join("");
    return `<div class="card mine">
      <div class="head"><span class="name">${esc([named(d.format), d.cube].filter(Boolean).join(" · "))}</span><span class="badge${d.checking ? " Checking" : ""}">${d.checking ? "Ready check" : "Filling"}</span></div>
      <div class="players">${chips}</div>
      <div class="foot"><span class="what">${d.checking ? "Everyone is here: say you're ready" : esc(seated || "Waiting for players")}</span>
        <button type="button" class="button quiet small" data-leave>Leave</button>
        <button type="button" class="button primary small" data-table="${esc(d.table)}">Open my table</button></div>
    </div>`;
  }

  function gameCard(g) {
    const what = g.stage === "Open" ? "Waiting for an opponent" : g.stage === "Seated" ? "Waiting for both players to sit down" : "Being played";
    const cancel = g.stage === "Open" ? `<button type="button" class="button quiet small" data-cancel="${esc(g.id)}">Call off</button>` : "";
    return `<div class="card mine">
      <div class="head"><span class="name">${g.players.length === 1 ? `${who(g.players[0], true)}'s game` : g.players.map(p => who(p, true)).join(" vs ")}</span><span class="badge${g.stage === "Playing" ? " live" : ""}">${esc(g.stage === "Open" ? "Waiting" : g.stage)}</span></div>
      <div class="meta">${esc(named(g.format))}</div>
      <div class="foot"><span class="what">${what}</span>${cancel}<button type="button" class="button primary small" data-game="${esc(g.id)}">Open my game</button></div>
    </div>`;
  }

  // What an event is, past its name, as HTML: its format and cube where the name does not say them, who against, and the record.
  function about(e) {
    const parts = [named(e.format), e.cube].filter(part => part && !e.name.includes(part)).map(esc);
    if (e.players <= 2 && e.opponents?.length) parts.push(`vs ${e.opponents.map(p => who(p, true)).join(", ")}`);
    else parts.push(esc(plural(e.players, "player")));
    if (e.wins + e.losses + e.draws > 0) parts.push(esc(`${e.wins}-${e.losses}${e.draws ? `-${e.draws}` : ""}`));
    return parts.join(" &middot; ");
  }

  function eventCard(e) {
    const actions = [];
    if (e.canDrop) actions.push(`<button type="button" class="button danger small" data-drop="${esc(e.id)}">Drop</button>`);
    actions.push(`<a class="button small" href="${results(e.id)}">${e.rounds > 1 ? "Standings" : "Details"}</a>`);
    if (!e.dropped) actions.push(`<button type="button" class="button primary small" data-return>Back to my seat</button>`);
    return `<div class="card mine">
      <div class="head"><span class="name">${esc(e.name)}</span><span class="badge ${esc(e.stage)}">${esc(e.dropped ? "Dropped" : e.outcome)}</span></div>
      <div class="meta">${about(e)}</div>
      ${e.detail ? `<div class="meta">${esc(e.detail)}</div>` : ""}
      <div class="foot" style="justify-content: flex-end">${actions.join("")}</div>
    </div>`;
  }

  function waitingCard(w) {
    return `<div class="card mine">
      <div class="head"><span class="name">Winston draft</span><span class="badge">Waiting</span></div>
      <div class="meta">Opened from Discord ${esc(when(w.created).toLowerCase())}</div>
      <div class="foot"><span class="what">Waiting for a second player to join in Discord</span><button type="button" class="button danger small" data-drop="${esc(w.id)}" data-waiting>Call off</button></div>
    </div>`;
  }

  function recentRow(e) {
    const tone = e.outcome === "Won" || e.outcome.startsWith("1st") ? "won" : e.stage === "Cancelled" ? "bad" : e.dropped ? "" : "info";
    return `<div class="row">
      <div class="main"><div class="title"><a href="${results(e.id)}">${esc(e.name)}</a></div>
        <div class="sub">${[about(e), esc(when(e.updated))].filter(Boolean).join(" &middot; ")}</div></div>
      <div class="side"><span class="outcome"><span class="badge ${tone}">${esc(e.outcome)}</span></span>
        <a class="button small" href="${results(e.id)}" aria-label="Results of ${esc(e.name)}">Results</a></div>
    </div>`;
  }

  function signedOut() {
    return board.signIn
      ? `<div class="signin-card"><img src="logo.png" alt="" width="72" height="72"><h2>Your games, events and decks</h2>
          <p>Sign in with Discord to see what you're playing, get back to your seat, and keep your decks.</p>
          <div class="actions"><a class="button discord large" href="signin?then=home" data-site-signin>Sign in with Discord</a></div></div>`
      : `<div class="signin-card"><img src="logo.png" alt="" width="72" height="72"><h2>Nobody can sign in here</h2>
          <p>This server has no Discord sign-in set up, so there are no players' pages. Everything being played is still open to look at.</p>
          <div class="actions">${board.hasDrafts ? `<a class="button primary" href="draft">Draft</a>` : ""}${board.hasConstructed ? `<a class="button" href="constructed">Constructed</a>` : ""}<a class="button" href="status">Events</a></div></div>`;
  }

  function render() {
    if (!board) return;
    if (!board.me) { $("content").innerHTML = signedOut(); return; }

    const playing = [];
    if (board.draft?.table) playing.push(tableCard(board.draft));
    for (const w of board.waiting ?? []) playing.push(waitingCard(w));
    const live = board.events.filter(e => e.live);
    for (const e of live) playing.push(eventCard(e));
    if (board.constructed) playing.push(gameCard(board.constructed));
    const recent = board.events.filter(e => !e.live);
    const leagues = board.leagues ?? [];
    // A league run that wants the player now - its draft, its match - is something they are playing.
    for (const l of leagues) if (l.mine.opponent || l.mine.current?.stage === "Drafting") playing.push(leagueCard(l));

    const ways = [];
    if (board.hasDrafts) ways.push(`<a class="card" href="draft"><span class="tile-title">Draft</span><span class="tile-text">Join a table filling up, or set up a booster, grid or Winston draft of your own.</span><span class="tile-go">Find a table &rarr;</span></a>`);
    if (board.hasLeagues) ways.push(`<a class="card" href="leagues"><span class="tile-title">Leagues</span><span class="tile-text">Draft against bots, then play your deck against other players, a match at a time, for a trophy.</span><span class="tile-go">See the leagues &rarr;</span></a>`);
    if (board.hasConstructed) ways.push(`<a class="card" href="constructed"><span class="tile-title">Constructed</span><span class="tile-text">A one-on-one game with a deck from the Standard gauntlet.</span><span class="tile-go">Find a game &rarr;</span></a>`);
    if (board.hasDecks) ways.push(`<a class="card" href="decks"><span class="tile-title">Decks</span><span class="tile-text">${board.decks ? `${plural(board.decks, "deck")} saved. Open one, or build a new one.` : "Build a deck for any format, and keep it."}</span><span class="tile-go">${board.decks ? "Open my decks" : "Build a deck"} &rarr;</span></a>`);

    const nothing = `<div class="empty"><p>You're not in anything right now.</p><div class="actions">${board.hasDrafts ? `<a class="button primary" href="draft">Find a draft</a>` : ""}${board.hasConstructed ? `<a class="button" href="constructed">Play constructed</a>` : ""}</div></div>`;

    $("content").innerHTML = `
      <div class="page-head"><div class="titles"><h1>Welcome, ${esc(board.me.name)}</h1>
        <p class="lead">What you're playing, the events you're in, and where to go next.</p></div></div>
      <section class="block" aria-labelledby="h-now">
        <div class="block-head"><h2 id="h-now">Playing now</h2>${playing.length ? `<span class="count">${playing.length}</span>` : ""}</div>
        <p class="about">Get back to your seat at any time, from any computer.</p>
        ${playing.length ? `<div class="cards">${playing.join("")}</div>` : nothing}
      </section>
      ${board.hasLeagues ? `<section class="block" aria-labelledby="h-leagues">
        <div class="block-head"><h2 id="h-leagues">Your leagues</h2>${leagues.length ? `<span class="count">${leagues.length}</span>` : ""}
          <div class="actions"><a class="button quiet small" href="leagues">Every league &rarr;</a></div></div>
        <p class="about">Your run in each league you've entered. Open one to find a match, see your deck, or start a new run.</p>
        ${leagues.length ? `<div class="cards">${leagues.map(leagueCard).join("")}</div>`
          : `<div class="empty small">You haven't entered a league yet. <a href="leagues">See the leagues</a>.</div>`}
      </section>` : ""}
      <section class="block" aria-labelledby="h-recent">
        <div class="block-head"><h2 id="h-recent">Recent events</h2>${recent.length ? `<span class="count">${recent.length}</span>` : ""}
          ${board.events.length ? `<div class="actions"><a class="button quiet small" href="status">Everything played &rarr;</a></div>` : ""}</div>
        <p class="about">Your drafts that have finished, with your result. Open one for its pairings and standings.</p>
        ${recent.length ? `<div class="rows">${recent.map(recentRow).join("")}</div>` : `<div class="empty small">Events you play will be listed here once they're over.</div>`}
      </section>
      ${ways.length ? `<section class="block" aria-labelledby="h-play"><div class="block-head"><h2 id="h-play">Play</h2></div><div class="tiles">${ways.join("")}</div></section>` : ""}`;
  }

  async function refresh() {
    try { board = await window.Cantrip.getJson("home/api/board"); } catch { return; }
    if (!busy) render();
  }

  async function act(work) {
    if (busy) return;
    busy = true;
    try { await work(); } finally { busy = false; }
    await refresh();
  }

  function dropQuestion(e, waiting) {
    if (waiting) return { title: "Call off your draft?", body: ["Nobody has joined it yet. It is called off, and its message in Discord goes."], confirmLabel: "Call it off" };
    const two = e.players <= 2;
    const body = two
      ? (e.stage === "Playing"
        ? ["You forfeit the game being played, and your opponent wins the draft.", "This can't be undone."]
        : ["A draft of two can't go on without you: it is called off for both of you.", "This can't be undone."])
      : [e.stage === "Playing"
          ? "You won't be paired again. If your match is being played, you concede it to your opponent; your results so far stay in the standings."
          : e.stage === "Drafting"
            ? "The draft carries on without you: your picks are made for you so nobody waits, and you won't be paired in the rounds."
            : "You won't be paired in the rounds. Your results so far stay in the standings.",
        "This can't be undone."];
    return { title: `Drop from ${e.name}?`, body, confirmLabel: "Drop", danger: true };
  }

  document.addEventListener("click", async event => {
    const target = event.target.closest("button");
    if (!target || target.disabled || target.closest("dialog") || !target.closest("#content")) return;
    const { seat, post, toast, confirm } = window.Cantrip;
    if (target.dataset.leaguePlay) await act(async () => { const why = await seat("leagues/api/play", { league: target.dataset.leaguePlay }); if (why) toast(why, "error"); });
    else if (target.dataset.table) await act(async () => { const why = await seat("draft/api/join", { table: target.dataset.table }); if (why) toast(why, "error"); });
    else if ("return" in target.dataset) await act(async () => { const why = await seat("draft/api/return"); if (why) toast(why, "error"); });
    else if (target.dataset.game) await act(async () => { const why = await seat("constructed/api/join", { game: target.dataset.game }); if (why) toast(why, "error"); });
    else if ("leave" in target.dataset) {
      if (!await confirm({ title: "Leave the table?", body: ["Your seat goes to the next player to join."], confirmLabel: "Leave table" })) return;
      await act(async () => {
        try { const answer = await post("home/api/leave"); if (answer?.refusal) toast(answer.refusal, "error"); else if (answer) toast("You left the table."); }
        catch (error) { toast(error.message, "error"); }
      });
    }
    else if (target.dataset.cancel) {
      if (!await confirm({ title: "Call off your game?", body: ["Nobody has joined it yet."], confirmLabel: "Call it off", danger: true })) return;
      await act(async () => {
        try { const answer = await post("constructed/api/cancel", { game: target.dataset.cancel }); if (answer?.refusal) toast(answer.refusal, "error"); else if (answer) toast("Your game was called off."); }
        catch (error) { toast(error.message, "error"); }
      });
    }
    else if (target.dataset.drop) {
      const e = board.events.find(each => each.id === target.dataset.drop);
      if (!await confirm(dropQuestion(e, "waiting" in target.dataset))) return;
      await act(async () => {
        try {
          const answer = await post("home/api/drop", { event: target.dataset.drop });
          if (answer?.refusal) toast(answer.refusal, "error");
          else if (answer) toast(e ? `You dropped from ${e.name}.` : "Your draft was called off.");
        } catch (error) { toast(error.message, "error"); }
      });
    }
  });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
