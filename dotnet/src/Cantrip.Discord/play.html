<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantrip - Constructed Play</title>
<!--site:head-->
</head>
<body data-page="constructed">
<!--site:header-->
<main id="main" class="wide">
  <div class="page-head">
    <div class="titles">
      <h1>Constructed</h1>
      <p class="lead">One-on-one games, each player bringing a deck of their choosing. Set up a game and wait for an opponent, or join one that is waiting.</p>
    </div>
  </div>
  <div id="formats" aria-live="polite"><p class="hint">Loading the games&hellip;</p></div>
</main>
<!--site:footer-->

<dialog id="deck" aria-labelledby="deck-title">
  <form method="dialog" id="deck-form">
    <h2 id="deck-title">Choose your deck</h2>
    <div class="fields">
      <label class="field wide">Deck<select name="deck" id="deck-select"></select></label>
    </div>
    <p class="hint" id="deck-hint"></p>
    <p class="form-error" id="deck-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="button quiet" id="deck-random">Random deck</button>
      <button type="button" class="button" id="deck-cancel">Cancel</button>
      <button type="submit" class="button primary" id="deck-submit">Sit down</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // The page asks the server for everything it shows, every few seconds, and sends a player to their seat - a link to
  // the web client, the seat's ticket after its #, which nothing here keeps or shows. Nobody's deck is shown here.
  const FORMATS = {
    standard: { title: "Standard Gauntlet", players: "1v1",
      about: "One game, two players, each with a Standard deck of their choosing from the gauntlet's lists." },
  };
  const STAGES = { Open: "Waiting", Seated: "Seated", Playing: "Playing" };

  let board = null;
  let picking = null;
  let busy = false;

  const $ = id => document.getElementById(id);
  const { esc, plural, toast } = window.Cantrip;
  const seated = () => Boolean(board?.me?.game);

  function gameCard(g) {
    const mine = board.me?.game === g.id;
    const chips = g.players.map(name => `<span class="chip${name === board.me?.name ? " me" : ""}">${esc(name)}</span>`);
    if (g.players.length < 2) chips.push(`<span class="chip open">Open seat</span>`);
    const what = g.stage === "Open" ? "Waiting for an opponent" : g.stage === "Seated" ? "Waiting for both players to sit down" : "Being played";
    let action = "";
    if (mine) {
      action = `<button type="button" class="button primary small" data-open="${esc(g.id)}">Open my game</button>`;
      if (g.stage === "Open") action = `<button type="button" class="button quiet small" data-cancel="${esc(g.id)}">Call off</button>` + action;
    } else if (g.stage === "Open" && !seated()) {
      action = `<button type="button" class="button primary small" data-join="${esc(g.id)}">Join</button>`;
    }
    return `<div class="card${mine ? " mine" : ""}">
      <div class="head"><span class="name">${esc(g.players.length === 1 ? `${g.players[0]}'s game` : g.players.join(" vs "))}</span><span class="badge ${g.stage === "Playing" ? "Playing" : ""}">${esc(STAGES[g.stage] ?? g.stage)}</span></div>
      <div class="players">${chips.join("")}</div>
      <div class="foot"><span class="what">${esc(what)}</span>${action}</div>
    </div>`;
  }

  function render() {
    if (!board) return;
    if (!board.formats.length) {
      $("formats").innerHTML = `<div class="empty"><p>This server hosts no constructed games right now.</p><div class="actions"><a class="button primary" href="draft">Find a draft instead</a></div></div>`;
      return;
    }
    $("formats").innerHTML = board.formats.map(f => {
      const about = FORMATS[f.key] ?? { title: f.key, players: "1v1", about: "" };
      const games = board.games.filter(g => g.format === f.key);
      const open = games.filter(g => g.stage === "Open");
      const playing = games.filter(g => g.stage !== "Open");
      return `<section class="block" aria-labelledby="h-${esc(f.key)}">
        <div class="block-head">
          <h2 id="h-${esc(f.key)}">${esc(about.title)}</h2><span class="count">${esc(about.players)}${games.length === 0 ? "" : ` · ${plural(open.length, "game")} waiting · ${playing.length} being played`}</span>
          <div class="actions"><button type="button" class="button primary small" data-create="${esc(f.key)}" ${seated() ? "disabled title=\"You are in a game already\"" : ""}>New game</button></div>
        </div>
        <p class="about">${esc(about.about)} ${plural(f.decks.length, "deck")} to choose from.</p>
        <div class="group"><h3>Waiting for an opponent</h3>
          ${open.length ? `<div class="cards">${open.map(gameCard).join("")}</div>` : `<div class="empty small">Nobody is waiting. Start a game with <strong>New game</strong>, and it's listed here for an opponent to join.</div>`}
        </div>
        ${playing.length ? `<div class="group"><h3>Being played</h3><div class="cards">${playing.map(gameCard).join("")}</div></div>` : ""}
      </section>`;
    }).join("");
  }

  async function refresh() {
    try { board = await window.Cantrip.getJson("constructed/api/board"); } catch { return; }
    if (!busy) render();
  }

  function needsSignIn() {
    if (board?.me) return false;
    if (board?.signIn) window.Cantrip.signIn("constructed");
    else toast("Nobody can sign in on this server, so nobody can play from this page.", "error");
    return true;
  }

  // Goes to the seat in this tab; returns why not.
  async function seat(path, body) {
    if (needsSignIn() || busy) return null;
    busy = true;
    try { return await window.Cantrip.seat(path, body); } finally { busy = false; }
  }

  // The deck picker, for a new game or a seat at one: the choice is remembered for next time, in this browser only.
  function pick(format, game) {
    if (needsSignIn()) return;
    const f = board.formats.find(each => each.key === format);
    if (!f) return;
    picking = { format, game };
    let last = null;
    try { last = localStorage.getItem(`cantrip.deck.${format}`); } catch { /* no storage: no memory */ }
    $("deck-select").innerHTML = f.decks.map(d => `<option value="${esc(d.name)}"${d.name === last ? " selected" : ""}>${esc(d.title)}</option>`).join("");
    $("deck-title").textContent = game ? "Choose your deck" : `New ${(FORMATS[format]?.title ?? format)} game`;
    $("deck-hint").textContent = game
      ? "You take the open seat, and the game begins once you both have the table open."
      : "You take the first seat, and the game is listed here for an opponent to join.";
    $("deck-error").textContent = "";
    $("deck-submit").disabled = false;
    $("deck").showModal();
  }

  $("deck-form").addEventListener("submit", async event => {
    event.preventDefault();
    const deck = $("deck-select").value;
    try { localStorage.setItem(`cantrip.deck.${picking.format}`, deck); } catch { /* not remembered */ }
    $("deck-submit").disabled = true;
    $("deck-error").textContent = "";
    const refusal = picking.game
      ? await seat("constructed/api/join", { game: picking.game, deck })
      : await seat("constructed/api/host", { format: picking.format, deck });
    $("deck-submit").disabled = false;
    if (refusal) $("deck-error").textContent = refusal;
  });
  $("deck-random").addEventListener("click", () => {
    const select = $("deck-select");
    select.selectedIndex = Math.floor(Math.random() * select.options.length);
  });
  $("deck-cancel").addEventListener("click", () => $("deck").close());

  document.addEventListener("click", async event => {
    const target = event.target.closest("button");
    if (!target || target.disabled || !target.closest("#formats")) return;
    if (target.dataset.join) pick(board.games.find(g => g.id === target.dataset.join)?.format, target.dataset.join);
    else if (target.dataset.open) {
      const refusal = await seat("constructed/api/join", { game: target.dataset.open });
      if (refusal) toast(refusal, "error");
    }
    else if (target.dataset.cancel) {
      if (!await window.Cantrip.confirm({ title: "Call off your game?", body: ["Nobody has joined it yet."], confirmLabel: "Call it off", danger: true })) return;
      try {
        const answer = await window.Cantrip.post("constructed/api/cancel", { game: target.dataset.cancel });
        if (answer?.refusal) toast(answer.refusal, "error"); else if (answer) toast("Your game was called off.");
      } catch (error) {
        toast(error.message, "error");
      }
      await refresh();
    }
    else if (target.dataset.create) pick(target.dataset.create, null);
  });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
