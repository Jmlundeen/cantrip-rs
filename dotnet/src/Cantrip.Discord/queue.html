<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantrip - Draft Queues</title>
<link rel="icon" href="data:,">
<style>
:root {
  --window: #111318;
  --bar: #191c22;
  --panel: #1d2127;
  --panel-hi: #242930;
  --line: #2c313a;
  --control: #2a303a;
  --control-hover: #353c48;
  --control-border: #3a4250;
  --fg: #e8eaee;
  --fg-soft: #a6adb8;
  --fg-muted: #6c7482;
  --on-accent: #17130a;
  --accent: #f1b44c;
  --accent-hover: #f6c66e;
  --ready: #6fcf8f;
  --danger: #e5534b;
  --hover: #8ec9ff;
  --discord: #5865f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--window);
  color: var(--fg);
  font: 14px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Roboto, "Helvetica Neue", sans-serif;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--hover); }
.num { font-variant-numeric: tabular-nums; }

header.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 24px; background: var(--bar); border-bottom: 1px solid var(--line);
}
header.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2px; }
header.top h1 span { color: var(--accent); }
header.top nav a { color: var(--fg-soft); text-decoration: none; font-size: 13px; }
header.top nav a:hover { color: var(--fg); }
header.top .who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-soft); }
header.top .who strong { color: var(--fg); font-weight: 600; }

main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

.notice {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 14px; margin-bottom: 20px;
}
.notice.error { border-color: var(--danger); }
.notice .grow { flex: 1; min-width: 200px; }

section.format { margin-bottom: 36px; }
section.format > .heading { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
section.format > .heading h2 { margin: 0; font-size: 18px; font-weight: 600; }
section.format > .heading .count { color: var(--fg-muted); font-size: 14px; }
section.format > .heading button { margin-left: auto; }
section.format > .about { color: var(--fg-soft); font-size: 13px; margin: 0 0 12px; }

.group { margin-bottom: 16px; }
.group h3 {
  margin: 0 0 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--fg-soft);
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card.mine { border-color: var(--accent); }
.card .head { display: flex; align-items: baseline; gap: 8px; }
.card .name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { color: var(--fg-soft); font-size: 13px; }
.card .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card .foot .what { color: var(--accent); font-weight: 600; flex: 1; }
.card .foot a.more { color: var(--fg-muted); font-size: 13px; text-decoration: none; }
.card .foot a.more:hover { color: var(--fg); }
.players { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
  background: var(--control); border: 1px solid var(--control-border); color: var(--fg); white-space: nowrap;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.chip.open { color: var(--fg-muted); border-style: dashed; border-color: var(--control-border); background: transparent; }
.chip.bot { color: var(--fg-soft); border-color: var(--line); background: transparent; }
.chip.dropped { color: var(--fg-muted); text-decoration: line-through; }
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .4px;
  text-transform: uppercase; background: rgba(166,173,184,.14); color: var(--fg-soft); white-space: nowrap;
}
.badge.Checking { background: rgba(111,207,143,.14); color: var(--ready); }
.badge.Drafting { background: rgba(241,180,76,.16); color: var(--accent); }
.badge.DeckBuilding { background: rgba(142,201,255,.14); color: var(--hover); }
.badge.Playing { background: rgba(111,207,143,.14); color: var(--ready); }
.empty { color: var(--fg-muted); padding: 4px 0 8px; }

button.plain, button.primary, button.discord, a.button {
  border-radius: 4px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--control-border);
  background: var(--control); text-decoration: none; display: inline-block; font-size: 14px; color: var(--fg);
}
button.plain:hover, a.button:hover { background: var(--control-hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.primary:hover { background: var(--accent-hover); }
button.discord { background: var(--discord); border-color: var(--discord); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a.button:focus-visible { outline: 2px solid var(--hover); outline-offset: 1px; }

dialog {
  background: var(--window); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 0;
  width: min(520px, calc(100vw - 32px));
}
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog form { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
dialog h2 { margin: 0; font-size: 18px; font-weight: 600; }
dialog .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-soft); }
dialog label.wide { grid-column: 1 / -1; }
dialog select, dialog input {
  background: var(--control); border: 1px solid var(--control-border); border-radius: 4px; padding: 6px 8px; width: 100%;
}
dialog select:focus, dialog input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
dialog .hint { color: var(--fg-muted); font-size: 12px; margin: 0; }
dialog .error { color: var(--danger); margin: 0; min-height: 1em; }
dialog .actions { display: flex; justify-content: flex-end; gap: 10px; }

@media (max-width: 600px) {
  header.top { padding: 10px 16px; }
  main { padding: 16px 16px 48px; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <h1><span>Cantrip</span> Draft Queues</h1>
  <nav><a href="play">Constructed play</a> &middot; <a href="status">Server status</a></nav>
  <div class="who" id="who"></div>
</header>
<main>
  <div id="notices"></div>
  <div id="formats"></div>
</main>

<dialog id="create">
  <form method="dialog" id="create-form">
    <h2 id="create-title">New draft</h2>
    <div class="fields" id="create-fields"></div>
    <p class="hint" id="create-hint"></p>
    <p class="error" id="create-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="plain" id="create-cancel">Cancel</button>
      <button type="submit" class="primary" id="create-submit">Create table</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // The page asks the server for everything it shows, every few seconds, and sends a player to their seat - a link to
  // the web client, the seat's ticket after its #, which nothing here keeps or shows.
  const FORMATS = [
    { key: "booster", title: "Booster draft", players: "8 players",
      about: "A pod of eight opens packs and passes them round, builds decks, then plays Swiss rounds of best-of-three." },
    { key: "grid", title: "Grid draft", players: "2 players",
      about: "Packs of nine laid out in a three-by-three grid; each player takes a row or a column." },
    { key: "winston", title: "Winston draft", players: "2 players",
      about: "Two players take turns at a row of face-down piles: take a pile, or add a card to it and look at the next." },
  ];
  const DEFAULTS = {
    booster: { packs: 3, packSize: 15, rounds: 3, minimumDeck: 40, bots: 0 },
    grid: { packs: 18, minimumDeck: 40, bots: 0 },
    winston: { cards: 90, piles: 3, minimumDeck: 40, bots: 0 },
  };
  const SEATS = { booster: 8, grid: 2, winston: 2 };
  const STAGES = { Seating: "Seating", Drafting: "Drafting", DeckBuilding: "Deck building", Playing: "Playing" };

  let board = null;
  let failure = null;
  let creating = null;
  let busy = false;

  const $ = id => document.getElementById(id);
  const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many ?? one + "s")}`;

  function settingsLine(s) {
    const deck = `decks of ${s.minimumDeck}+`;
    switch (s.format) {
      case "booster": return `${plural(s.packs, "pack")} of ${s.packSize} · ${plural(s.rounds, "round")} · ${deck}`;
      case "grid": return `${plural(s.packs, "grid")} · ${deck}`;
      default: return `${s.cards === 0 ? "the whole cube" : `${s.cards} cards`} · ${plural(s.piles, "pile")} · ${deck}`;
    }
  }

  function seatChips(players, seats, bots) {
    const chips = players.map(name => `<span class="chip">${esc(name)}</span>`);
    for (let i = players.length; i < seats; i++) chips.push(`<span class="chip open">Open seat</span>`);
    for (let i = 0; i < bots; i++) chips.push(`<span class="chip bot">${bots === 1 ? "Bot" : `Bot ${i + 1}`}</span>`);
    return `<div class="players">${chips.join("")}</div>`;
  }

  // A player with a seat, or in a draft, has nowhere else to sit until they leave it.
  const seated = () => Boolean(board?.me?.table || board?.me?.drafting);

  function queueName(id) {
    const queue = board.queues.find(q => q.id === id);
    return queue?.channel ? `${queue.channel} queue` : "Discord queue";
  }

  function tableCard(t) {
    const mine = board.me?.table === t.id;
    const full = t.checking || t.players.length >= t.seats;
    const where = t.queue ? queueName(t.queue) : "Set up here";
    const what = t.checking ? "Ready check" : `${t.players.length} of ${t.seats} seated`;
    let action = "";
    if (mine) action = `<button class="primary" data-open="${esc(t.id)}">Open my table</button>`;
    else if (!full && !seated()) action = `<button class="primary" data-join="${esc(t.id)}">Join</button>`;
    return `<div class="card${mine ? " mine" : ""}">
      <div class="head"><span class="name">${esc(t.settings.cube)}</span><span class="badge${t.checking ? " Checking" : ""}">${t.checking ? "Ready check" : "Seating"}</span></div>
      <div class="meta">${esc(settingsLine(t.settings))} · ${esc(where)}</div>
      ${seatChips(t.players, t.seats, t.settings.bots)}
      <div class="foot"><span class="what">${esc(what)}</span>${action}</div>
    </div>`;
  }

  // A queue with no table taking players: a card to start its next table from.
  function queueCard(q) {
    const s = q.settings;
    const seats = s.seats - s.bots;
    return `<div class="card">
      <div class="head"><span class="name">${esc(s.cube)}</span><span class="badge">Seating</span></div>
      <div class="meta">${esc(settingsLine(s))} · ${esc(q.channel ? `${q.channel} queue` : "Discord queue")}</div>
      ${seatChips([], seats, s.bots)}
      <div class="foot"><span class="what">0 of ${seats} seated</span>${seated() ? "" : `<button class="primary" data-queue="${esc(q.id)}">Join</button>`}</div>
    </div>`;
  }

  function underwayCard(e) {
    const players = e.players.map(p => `<span class="chip${p.dropped ? " dropped" : ""}">${esc(p.name)}</span>`).join("");
    return `<div class="card">
      <div class="head"><span class="name">${esc(e.cube || e.name)}</span><span class="badge ${esc(e.stage)}">${esc(STAGES[e.stage] ?? e.stage)}</span></div>
      <div class="players">${players}</div>
      <div class="foot"><span class="what">${esc(e.progress)}</span><a class="more" href="status#event=${encodeURIComponent(e.id)}">Details</a></div>
    </div>`;
  }

  function renderWho() {
    const who = $("who");
    if (!board) { who.innerHTML = ""; return; }
    if (board.me) {
      who.innerHTML = `Signed in as <strong>${esc(board.me.name)}</strong> <button class="plain" id="signout">Sign out</button>`;
    } else if (board.signIn) {
      who.innerHTML = `<button class="discord" id="signin">Sign in with Discord</button>`;
    } else {
      who.innerHTML = `<span>Sign-in isn't set up on this server</span>`;
    }
  }

  function renderNotices() {
    const notes = [];
    if (failure) notes.push(`<div class="notice error"><span class="grow">${esc(failure)}</span><button class="plain" data-dismiss>Dismiss</button></div>`);
    if (board?.me?.drafting) {
      notes.push(`<div class="notice"><span class="grow">You're in a draft.</span><button class="primary" data-return>Back to my draft</button></div>`);
    } else if (board?.me?.table) {
      notes.push(`<div class="notice"><span class="grow">You have a seat at a table that is still filling.</span><button class="primary" data-open="${esc(board.me.table)}">Open my table</button></div>`);
    }
    $("notices").innerHTML = notes.join("");
  }

  function renderFormats() {
    if (!board) return;
    $("formats").innerHTML = FORMATS.map(f => {
      const tables = board.tables.filter(t => t.settings.format === f.key);
      // A queue's next table is its oldest still taking players; a queue with none is joined from a card of its own.
      const idle = board.queues.filter(q => q.settings.format === f.key
        && !tables.some(t => t.queue === q.id && !t.checking && t.players.length < t.seats));
      const underway = board.underway.filter(e => e.format === f.key);
      const forming = [...idle.map(queueCard), ...tables.map(tableCard)];
      const unavailable = f.key === "booster" && !board.boosters;
      const count = tables.length + underway.length;
      return `<section class="format" aria-labelledby="h-${f.key}">
        <div class="heading">
          <h2 id="h-${f.key}">${f.title} <span class="count">${f.players}</span></h2>
          <span class="count">${count === 0 ? "" : `${plural(tables.length, "table")} forming · ${underway.length} under way`}</span>
          <button class="plain" data-create="${f.key}" ${unavailable ? "disabled title=\"This server doesn't run booster drafts\"" : ""}>New Draft</button>
        </div>
        <p class="about">${f.about}</p>
        <div class="group"><h3>Seating players</h3>
          ${forming.length ? `<div class="cards">${forming.join("")}</div>` : `<div class="empty">No tables are taking players. Start one with New Draft.</div>`}
        </div>
        ${underway.length ? `<div class="group"><h3>Under way</h3><div class="cards">${underway.map(underwayCard).join("")}</div></div>` : ""}
      </section>`;
    }).join("");
  }

  function render() {
    renderWho();
    renderNotices();
    renderFormats();
  }

  async function refresh() {
    try {
      const response = await fetch("queue/api/board", { cache: "no-store", credentials: "same-origin" });
      if (!response.ok) throw new Error(`${response.status}`);
      board = (await response.json()).value;
    } catch {
      // Kept as it was; the next refresh tries again.
      return;
    }
    if (!busy) render();
  }

  // A sign-in is needed for everything that takes a seat; without one, off to Discord and back.
  function needsSignIn() {
    if (board?.me) return false;
    if (board?.signIn) location.assign("signin?then=queue");
    else { failure = "Sign-in isn't set up on this server, so nobody can join from this page."; render(); }
    return true;
  }

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST", credentials: "same-origin", cache: "no-store",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}),
    });
    if (response.status === 401) { location.assign("signin?then=queue"); return null; }
    if (!response.ok) throw new Error(`The server said ${response.status}.`);
    return (await response.json()).value;
  }

  // Goes to the seat in this tab: a seat that is not opened soon goes back to the queue.
  async function seat(path, body) {
    if (needsSignIn() || busy) return null;
    busy = true;
    try {
      const answer = await post(path, body);
      if (answer?.link) { location.assign(answer.link); return null; }
      return answer?.refusal ?? null;
    } catch (error) {
      return error.message || "The server could not be reached.";
    } finally {
      busy = false;
    }
  }

  async function act(path, body) {
    const refusal = await seat(path, body);
    if (refusal) { failure = refusal; render(); }
  }

  function field(name, label, value, min, max, wide) {
    return `<label${wide ? ` class="wide"` : ""}>${label}<input type="number" name="${name}" value="${value}" min="${min}" max="${max}" required></label>`;
  }

  function openCreate(format) {
    if (needsSignIn()) return;
    creating = format;
    const f = FORMATS.find(each => each.key === format);
    const queue = board.queues.find(q => q.settings.format === format);
    const d = { ...DEFAULTS[format], ...(queue ? queue.settings : {}) };
    const cubes = board.cubes.length ? board.cubes : [d.cube ?? "LSVCube"];
    const cube = cubes.includes(d.cube) ? d.cube : cubes.includes("LSVCube") ? "LSVCube" : cubes[0];
    const options = cubes.map(c => `<option${c === cube ? " selected" : ""}>${esc(c)}</option>`).join("");
    const fields = [`<label class="wide">Cube<select name="cube">${options}</select></label>`];
    if (format === "booster") {
      fields.push(field("packs", "Packs each", d.packs, 1, 6), field("packSize", "Cards a pack", d.packSize, 5, 20), field("rounds", "Swiss rounds", d.rounds, 1, 5));
    } else if (format === "grid") {
      fields.push(field("packs", "Grids", d.packs, 1, 40));
    } else {
      fields.push(field("cards", "Cards (0 for all)", d.cards, 0, 1000), field("piles", "Piles", d.piles, 1, 8));
    }
    fields.push(field("minimumDeck", "Smallest deck", d.minimumDeck, 1, 200), field("bots", "Bot seats", d.bots ?? 0, 0, SEATS[format] - 1));
    $("create-title").textContent = `New ${f.title.toLowerCase()}`;
    $("create-fields").innerHTML = fields.join("");
    $("create-hint").textContent = "You take the first seat, and the table opens. It is listed here for others to join; it closes once everyone has left it.";
    $("create-error").textContent = "";
    $("create-submit").disabled = false;
    $("create").showModal();
  }

  $("create-form").addEventListener("submit", async event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target));
    const body = { format: creating, cube: data.cube };
    for (const key of ["cards", "piles", "packs", "packSize", "rounds", "minimumDeck", "bots"]) {
      if (key in data) body[key] = Number(data[key]);
    }
    $("create-submit").disabled = true;
    $("create-error").textContent = "";
    const refusal = await seat("queue/api/create", body);
    $("create-submit").disabled = false;
    if (refusal) $("create-error").textContent = refusal;
  });
  $("create-cancel").addEventListener("click", () => $("create").close());

  document.addEventListener("click", async event => {
    const target = event.target.closest("button");
    if (!target || target.disabled) return;
    if (target.id === "signin") location.assign("signin?then=queue");
    else if (target.id === "signout") {
      try { await post("signout"); } catch { /* signed out or not, the board says */ }
      await refresh();
    }
    else if (target.dataset.join) await act("queue/api/join", { table: target.dataset.join });
    else if (target.dataset.open) await act("queue/api/join", { table: target.dataset.open });
    else if (target.dataset.queue) await act("queue/api/join", { queue: target.dataset.queue });
    else if (target.dataset.create) openCreate(target.dataset.create);
    else if ("return" in target.dataset) await act("queue/api/return");
    else if ("dismiss" in target.dataset) { failure = null; render(); }
  });

  if (new URLSearchParams(location.search).get("signin") === "failed") {
    failure = "Signing in with Discord didn't go through. Try again.";
    history.replaceState(null, "", location.pathname);
  }

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
