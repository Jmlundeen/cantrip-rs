<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantrip - Draft Queues</title>
<!--site:head-->
</head>
<body data-page="draft">
<!--site:header-->
<main id="main" class="wide">
  <div class="page-head">
    <div class="titles">
      <h1>Draft</h1>
      <p class="lead">Join a table that is filling, or set up one of your own. When every seat is taken and everyone is ready, the draft begins at that table.</p>
    </div>
  </div>
  <div id="formats" aria-live="polite"><p class="hint">Loading the queues&hellip;</p></div>
</main>
<!--site:footer-->

<dialog id="create" aria-labelledby="create-title">
  <form method="dialog" id="create-form">
    <h2 id="create-title">New draft</h2>
    <div class="fields" id="create-fields"></div>
    <p class="hint" id="create-hint"></p>
    <p class="form-error" id="create-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="button" id="create-cancel">Cancel</button>
      <button type="submit" class="button primary" id="create-submit">Create table</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // The page asks the server for everything it shows, every few seconds, and sends a player to their seat - a link to
  // the web client, the seat's ticket after its #, which nothing here keeps or shows.
  const FORMATS = [
    { key: "booster", title: "Booster draft", players: "8 players",
      about: "A pod of eight opens packs and passes them round, builds decks, then plays Swiss rounds of best-of-three." },
    { key: "grid", title: "Grid draft", players: "2 players",
      about: "Packs of nine laid out in a three-by-three grid; each player takes a row or a column." },
    { key: "winston", title: "Winston draft", players: "2 players",
      about: "Two players take turns at a row of face-down piles: take a pile, or add a card to it and look at the next." },
  ];
  const DEFAULTS = {
    booster: { packs: 3, packSize: 15, rounds: 3, minimumDeck: 40, bots: 0 },
    grid: { packs: 18, minimumDeck: 40, bots: 0 },
    winston: { cards: 90, piles: 3, minimumDeck: 40, bots: 0 },
  };
  const SEATS = { booster: 8, grid: 2, winston: 2 };
  const STAGES = { Seating: "Seating", Drafting: "Drafting", DeckBuilding: "Deck building", Playing: "Playing" };

  let board = null;
  let creating = null;
  let busy = false;

  const $ = id => document.getElementById(id);
  const { esc, plural, toast } = window.Cantrip;

  function settingsLine(s) {
    const deck = `decks of ${s.minimumDeck}+`;
    switch (s.format) {
      case "booster": return `${plural(s.packs, "pack")} of ${s.packSize} · ${plural(s.rounds, "round")} · ${deck}`;
      case "grid": return `${plural(s.packs, "grid")} · ${deck}`;
      default: return `${s.cards === 0 ? "the whole cube" : `${s.cards} cards`} · ${plural(s.piles, "pile")} · ${deck}`;
    }
  }

  function seatChips(players, seats, bots) {
    const chips = players.map(name => `<span class="chip${name === board.me?.name ? " me" : ""}">${esc(name)}</span>`);
    for (let i = players.length; i < seats; i++) chips.push(`<span class="chip open">Open seat</span>`);
    for (let i = 0; i < bots; i++) chips.push(`<span class="chip bot">${bots === 1 ? "Bot" : `Bot ${i + 1}`}</span>`);
    return `<div class="players">${chips.join("")}</div>`;
  }

  // A player with a seat, or in a draft, has nowhere else to sit until they leave it.
  const seated = () => Boolean(board?.me?.table || board?.me?.drafting);

  function queueName(id) {
    const queue = board.queues.find(q => q.id === id);
    return queue?.channel ? `#${queue.channel} queue` : "Discord queue";
  }

  function tableCard(t) {
    const mine = board.me?.table === t.id;
    const full = t.checking || t.players.length >= t.seats;
    const where = t.queue ? queueName(t.queue) : "Set up here";
    const what = t.checking ? "Ready check" : `${t.players.length} of ${t.seats} seated`;
    let action = "";
    if (mine) action = `<button type="button" class="button quiet small" data-leave>Leave</button><button type="button" class="button primary small" data-open="${esc(t.id)}">Open my table</button>`;
    else if (!full && !seated()) action = `<button type="button" class="button primary small" data-join="${esc(t.id)}">Join</button>`;
    else if (!full) action = `<span class="hint">You have a seat elsewhere</span>`;
    return `<div class="card${mine ? " mine" : ""}">
      <div class="head"><span class="name">${esc(t.settings.cube)}</span><span class="badge${t.checking ? " Checking" : ""}">${t.checking ? "Ready check" : "Seating"}</span></div>
      <div class="meta">${esc(settingsLine(t.settings))} · ${esc(where)}</div>
      ${seatChips(t.players, t.seats, t.settings.bots)}
      <div class="foot"><span class="what">${esc(what)}</span>${action}</div>
    </div>`;
  }

  // A queue with no table taking players: a card to start its next table from.
  function queueCard(q) {
    const s = q.settings;
    const seats = s.seats - s.bots;
    return `<div class="card">
      <div class="head"><span class="name">${esc(s.cube)}</span><span class="badge">Seating</span></div>
      <div class="meta">${esc(settingsLine(s))} · ${esc(q.channel ? `#${q.channel} queue` : "Discord queue")}</div>
      ${seatChips([], seats, s.bots)}
      <div class="foot"><span class="what">0 of ${seats} seated</span>${seated() ? "" : `<button type="button" class="button primary small" data-queue="${esc(q.id)}">Join</button>`}</div>
    </div>`;
  }

  function underwayCard(e) {
    const players = e.players.map(p => `<span class="chip${p.dropped ? " dropped" : ""}${p.name === board.me?.name ? " me" : ""}">${esc(p.name)}</span>`).join("");
    return `<div class="card">
      <div class="head"><span class="name">${esc(e.cube || e.name)}</span><span class="badge ${esc(e.stage)}">${esc(STAGES[e.stage] ?? e.stage)}</span></div>
      <div class="players">${players}</div>
      <div class="foot"><span class="what">${esc(e.progress)}</span><a class="button quiet small" href="status#event=${encodeURIComponent(e.id)}">Details</a></div>
    </div>`;
  }

  function render() {
    if (!board) return;
    $("formats").innerHTML = FORMATS.map(f => {
      const tables = board.tables.filter(t => t.settings.format === f.key);
      // A queue's next table is its oldest still taking players; a queue with none is joined from a card of its own.
      const idle = board.queues.filter(q => q.settings.format === f.key
        && !tables.some(t => t.queue === q.id && !t.checking && t.players.length < t.seats));
      const underway = board.underway.filter(e => e.format === f.key);
      const forming = [...idle.map(queueCard), ...tables.map(tableCard)];
      const unavailable = f.key === "booster" && !board.boosters;
      const count = tables.length + underway.length;
      return `<section class="block" aria-labelledby="h-${f.key}">
        <div class="block-head">
          <h2 id="h-${f.key}">${f.title}</h2><span class="count">${f.players}${count === 0 ? "" : ` · ${plural(tables.length, "table")} forming · ${underway.length} under way`}</span>
          <div class="actions"><button type="button" class="button small" data-create="${f.key}" ${unavailable ? "disabled title=\"This server doesn't run booster drafts\"" : ""}>New ${f.title.toLowerCase()}</button></div>
        </div>
        <p class="about">${f.about}</p>
        <div class="group"><h3>Seating players</h3>
          ${forming.length ? `<div class="cards">${forming.join("")}</div>` : `<div class="empty small">${unavailable ? "This server doesn't run booster drafts." : `No tables are taking players. Start one with <strong>New ${esc(f.title.toLowerCase())}</strong>.`}</div>`}
        </div>
        ${underway.length ? `<div class="group"><h3>Under way</h3><div class="cards">${underway.map(underwayCard).join("")}</div></div>` : ""}
      </section>`;
    }).join("");
  }

  async function refresh() {
    try { board = await window.Cantrip.getJson("draft/api/board"); } catch { return; }
    if (!busy) render();
  }

  // A sign-in is needed for everything that takes a seat; without one, off to Discord and back.
  function needsSignIn() {
    if (board?.me) return false;
    if (board?.signIn) window.Cantrip.signIn("draft");
    else toast("Nobody can sign in on this server, so nobody can join from this page.", "error");
    return true;
  }

  // Goes to the seat in this tab: a seat that is not opened soon goes back to the queue.
  async function seat(path, body) {
    if (needsSignIn() || busy) return null;
    busy = true;
    try { return await window.Cantrip.seat(path, body); } finally { busy = false; }
  }

  async function act(path, body) {
    const refusal = await seat(path, body);
    if (refusal) toast(refusal, "error");
  }

  function field(name, label, value, min, max, wide) {
    return `<label class="field${wide ? " wide" : ""}">${label}<input type="number" name="${name}" value="${value}" min="${min}" max="${max}" required></label>`;
  }

  function openCreate(format) {
    if (needsSignIn()) return;
    creating = format;
    const f = FORMATS.find(each => each.key === format);
    const queue = board.queues.find(q => q.settings.format === format);
    const d = { ...DEFAULTS[format], ...(queue ? queue.settings : {}) };
    const cubes = board.cubes.length ? board.cubes : [d.cube ?? "LSVCube"];
    const cube = cubes.includes(d.cube) ? d.cube : cubes.includes("LSVCube") ? "LSVCube" : cubes[0];
    const options = cubes.map(c => `<option${c === cube ? " selected" : ""}>${esc(c)}</option>`).join("");
    const fields = [`<label class="field wide">Cube<select name="cube">${options}</select></label>`];
    if (format === "booster") {
      fields.push(field("packs", "Packs each", d.packs, 1, 6), field("packSize", "Cards a pack", d.packSize, 5, 20), field("rounds", "Swiss rounds", d.rounds, 1, 5));
    } else if (format === "grid") {
      fields.push(field("packs", "Grids", d.packs, 1, 40));
    } else {
      fields.push(field("cards", "Cards (0 for all)", d.cards, 0, 1000), field("piles", "Piles", d.piles, 1, 8));
    }
    fields.push(field("minimumDeck", "Smallest deck", d.minimumDeck, 1, 200), field("bots", "Bot seats", d.bots ?? 0, 0, SEATS[format] - 1));
    $("create-title").textContent = `New ${f.title.toLowerCase()}`;
    $("create-fields").innerHTML = fields.join("");
    $("create-hint").textContent = "You take the first seat, and the table opens. It is listed here for others to join; it closes once everyone has left it.";
    $("create-error").textContent = "";
    $("create-submit").disabled = false;
    $("create").showModal();
  }

  $("create-form").addEventListener("submit", async event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target));
    const body = { format: creating, cube: data.cube };
    for (const key of ["cards", "piles", "packs", "packSize", "rounds", "minimumDeck", "bots"]) {
      if (key in data) body[key] = Number(data[key]);
    }
    $("create-submit").disabled = true;
    $("create-error").textContent = "";
    const refusal = await seat("draft/api/create", body);
    $("create-submit").disabled = false;
    if (refusal) $("create-error").textContent = refusal;
  });
  $("create-cancel").addEventListener("click", () => $("create").close());

  document.addEventListener("click", async event => {
    const target = event.target.closest("button");
    if (!target || target.disabled || !target.closest("#formats")) return;
    if (target.dataset.join) await act("draft/api/join", { table: target.dataset.join });
    else if (target.dataset.open) await act("draft/api/join", { table: target.dataset.open });
    else if (target.dataset.queue) await act("draft/api/join", { queue: target.dataset.queue });
    else if (target.dataset.create) openCreate(target.dataset.create);
    else if ("leave" in target.dataset) {
      if (!await window.Cantrip.confirm({ title: "Leave the table?", body: ["Your seat goes to the next player to join."], confirmLabel: "Leave table" })) return;
      try {
        const answer = await window.Cantrip.post("home/api/leave");
        if (answer?.refusal) toast(answer.refusal, "error"); else if (answer) toast("You left the table.");
      } catch (error) { toast(error.message, "error"); }
      await refresh();
    }
  });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
